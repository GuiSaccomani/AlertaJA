spring:
  datasource:
    url: jdbc:h2:file:./data/alertajadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Segurança: A variável SENSOR_INGESTION_API_KEY continua estritamente obrigatória via ambiente
alertaja:
  sensor:
    api-key: ${SENSOR_INGESTION_API_KEY}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: 8
