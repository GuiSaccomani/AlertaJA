server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: alertaja
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alertaja}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configurações de Segurança e Integração do AlertaJá
alertaja:
  sensor:
    # A variável de ambiente SENSOR_INGESTION_API_KEY é ESTRITAMENTE OBRIGATÓRIA (sem fallback padrão)
    api-key: ${SENSOR_INGESTION_API_KEY}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: 8

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
